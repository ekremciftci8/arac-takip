<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Araçlarım</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Araçlarım">
<meta name="theme-color" content="#1A1D24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1D24;--surface:#242832;--surface2:#2C313D;
  --accent:#E8873A;--sage:#7FA97F;--rust:#C1785A;
  --paper:#F0EEE8;--muted:#8B92A0;--border:#3A4051;
}
:root.light{
  --ink:#F5F3EE;--surface:#FFFFFF;--surface2:#EDE9E1;
  --paper:#1A1D24;--muted:#7A7A8A;--border:#D8D4CC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',-apple-system,sans-serif;min-height:100vh;padding-bottom:80px;padding-top:env(safe-area-inset-top);}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-icon{width:80px;height:80px;border-radius:20px;background:rgba(232,135,58,0.15);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.splash-title{font-family:'Newsreader',serif;font-size:28px;font-weight:600;color:var(--paper);}
.splash-sub{font-size:13px;color:var(--muted);margin-top:6px;}

/* LAYOUT */
.page{max-width:640px;margin:0 auto;padding:16px 16px 0;}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.app-title{font-family:'Newsreader',serif;font-size:24px;font-weight:600;}
.header-actions{display:flex;gap:8px;}
.hbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--paper);cursor:pointer;font-size:16px;}

/* ARAÇ SEKME */
.vehicle-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.vehicle-tabs::-webkit-scrollbar{display:none;}
.vtab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);white-space:nowrap;}
.vtab.active{border-color:var(--accent);color:var(--accent);background:rgba(232,135,58,0.1);}
.vtab-photo{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--border);}
.vtab-add{flex:0 0 auto;border:1px dashed var(--border);border-radius:12px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);background:transparent;white-space:nowrap;}

/* ARAÇ KAPAK */
.vehicle-cover{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;height:140px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.vehicle-cover img{width:100%;height:100%;object-fit:cover;}
.vehicle-cover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.5) 50%,rgba(0,0,0,0.1) 100%);display:flex;align-items:flex-end;padding:14px;}
.vehicle-cover-info{flex:1;}
.vehicle-cover-name{font-family:'Newsreader',serif;font-size:22px;font-weight:700;color:#FFFFFF;text-shadow:0 2px 8px rgba(0,0,0,1),0 0 20px rgba(0,0,0,0.8);}
.vehicle-cover-sub{font-size:12px;color:rgba(255,255,255,0.95);margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,1);}
.cover-edit-btn{background:rgba(255,255,255,0.15);border:none;color:var(--paper);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);}

/* MUAYENE WIDGET */
.service-widget{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px;}
.sw-card{border-radius:12px;padding:12px;border:1px solid;position:relative;overflow:hidden;}
.sw-card.ok{background:rgba(127,169,127,0.1);border-color:var(--sage);}
.sw-card.warn{background:rgba(232,135,58,0.1);border-color:var(--orange,var(--accent));}
.sw-card.overdue{background:rgba(193,120,90,0.15);border-color:var(--rust);}
.sw-name{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.sw-days{font-family:'Newsreader',serif;font-size:28px;font-weight:600;margin:4px 0 2px;}
.sw-days.ok{color:var(--sage);}
.sw-days.warn{color:var(--accent);}
.sw-days.overdue{color:var(--rust);}
.sw-date{font-size:11px;color:var(--muted);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:transparent;border:none;color:var(--muted);font-size:10px;font-family:inherit;cursor:pointer;font-weight:600;}
.bnav-btn.active{color:var(--accent);}
.bnav-icon{font-size:20px;line-height:1;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.card-row{display:flex;gap:8px;flex-wrap:wrap;}
.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
input,select,textarea{background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--paper);font-family:inherit;font-size:14px;outline:none;flex:1;min-width:0;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}
.lbl{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;}
.field{flex:1;min-width:140px;}
.ghost-btn{background:transparent;border:none;color:var(--muted);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;}
.primary-btn{background:var(--accent);border:none;color:var(--ink);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.primary-btn-sm{background:var(--accent);border:none;color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.danger-btn{background:transparent;border:1px solid var(--rust);color:var(--rust);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-top:8px;}
.outline-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer;}
.err{color:var(--rust);font-size:13px;margin-top:6px;}
.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:30px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;}

/* SECTION */
.section-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;}
.section-title{font-family:'Newsreader',serif;font-size:18px;font-weight:500;}

/* STATS */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--surface2);border-radius:12px;padding:14px;}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.stat-value{font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:var(--accent);}
.stat-value.sage{color:var(--sage);}

/* ALERTS */
.alert-box{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid;}
.alert-box.red{background:rgba(193,120,90,0.15);border-color:var(--rust);}
.alert-box.orange{background:rgba(232,135,58,0.1);border-color:var(--accent);}
.alert-box.yellow{background:rgba(232,135,58,0.06);border-color:#b8862a;}
.alert-title{font-size:14px;font-weight:600;}
.alert-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge.red{background:var(--rust);color:var(--ink);}
.badge.orange{background:var(--accent);color:var(--ink);}

/* RECORDS */
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;}
.rcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.rcard-type{font-size:15px;font-weight:600;}
.rcard-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.rcard-cost{font-family:'Newsreader',serif;font-size:17px;color:var(--accent);white-space:nowrap;}
.rcard-next{font-size:12px;color:var(--sage);margin-top:6px;}
.rcard-note{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.rcard-photo{width:100%;max-width:220px;border-radius:8px;margin-top:8px;border:1px solid var(--border);}
.del-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;flex-shrink:0;}
.del-btn:hover{color:var(--rust);}

/* FILTER */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.fbtn{background:var(--ink);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
.fbtn.active{border-color:var(--accent);color:var(--accent);}

/* KM */
.km-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.km-val{font-family:'Newsreader',serif;font-size:30px;font-weight:500;}
.km-lbl{font-size:12px;color:var(--muted);}
.km-btn{background:var(--ink);border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none !important;align-items:flex-end;justify-content:center;z-index:200;}
.modal.open{display:flex !important;}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}

/* CHART */
.chart-bar-wrap{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.chart-bar-row{display:flex;align-items:center;gap:8px;}
.chart-bar-label{font-size:12px;color:var(--muted);width:40px;text-align:right;flex-shrink:0;}
.chart-bar-bg{flex:1;height:20px;background:var(--ink);border-radius:4px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.chart-bar-val{font-size:12px;color:var(--muted);width:70px;text-align:left;flex-shrink:0;}

/* COLOR PICKER */
.color-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.color-opt{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.color-opt.selected{border-color:white;}

/* CONTACT */
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.call-btn{background:var(--sage);border:none;color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

/* CAL */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;}
.cal-day-name{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;}
.cal-day{text-align:center;font-size:13px;padding:6px 4px;border-radius:6px;}
.cal-day.today{background:var(--accent);color:var(--ink);font-weight:700;}
.cal-day.has-event{background:rgba(232,135,58,0.2);color:var(--accent);font-weight:600;}
.cal-day.has-alert{background:rgba(193,120,90,0.3);color:var(--rust);font-weight:700;}
.cal-day.other-month{color:var(--border);}

/* REPEAT RULE */
.repeat-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(127,169,127,0.15);border:1px solid var(--sage);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--sage);margin-top:4px;}

/* ÖZET / WIDGET */
.ozet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.ozet-vehicle-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color 0.2s;}
.ozet-vehicle-card:hover{border-color:var(--accent);}
.ozet-card-cover{height:80px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.ozet-card-cover img{width:100%;height:100%;object-fit:cover;}
.ozet-card-body{padding:10px;}
.ozet-card-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.ozet-card-km{font-size:12px;color:var(--muted);}
.ozet-card-alert{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:4px;}
.ozet-card-alert.red{color:var(--rust);}
.ozet-card-alert.orange{color:var(--accent);}
.ozet-card-alert.ok{color:var(--sage);}

/* KARŞILAŞTIRMA */
.compare-row{display:grid;gap:10px;margin-bottom:8px;}
.compare-header{display:grid;gap:10px;margin-bottom:12px;}
.compare-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.compare-cell.winner{border-color:var(--sage);background:rgba(127,169,127,0.1);}
.compare-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
.compare-val{font-family:'Newsreader',serif;font-size:18px;font-weight:600;}

/* QUICK ADD */
.quick-add-fab{position:fixed;right:20px;bottom:90px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:var(--ink);font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(232,135,58,0.4);z-index:99;display:flex;align-items:center;justify-content:center;}

/* ŞABLONLAR */
.template-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.template-card:hover{border-color:var(--accent);}
.template-name{font-size:14px;font-weight:600;}
.template-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.template-count{background:rgba(232,135,58,0.15);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;}
.repeat-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(127,169,127,0.15);border:1px solid var(--sage);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--sage);margin-top:4px;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-icon">
    <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
      <path d="M22 62A28 28 0 1 1 78 62" stroke="#E8873A" stroke-width="7" stroke-linecap="round"/>
      <line x1="50" y1="62" x2="68" y2="40" stroke="#E8873A" stroke-width="7" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="7" fill="#E8873A"/>
    </svg>
  </div>
  <div class="splash-title">Araçlarım</div>
  <div class="splash-sub">Bakım takip uygulaması</div>
</div>

<div class="page">
  <div class="header">
    <div class="app-title">Araçlarım</div>
    <div class="header-actions">
      <button class="hbtn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="vehicle-tabs" id="vehicleTabs"></div>

  <div id="newVehicleForm" class="card" style="display:none;">
    <div class="card-row"><input id="newVehicleName" placeholder="Araç adı (örn. Honda CB500, Civic)"></div>
    <div style="margin-top:8px;"><label class="lbl">Renk teması</label>
      <div class="color-opts" id="colorOpts"></div>
    </div>
    <div id="newVehicleErr" class="err" style="display:none;"></div>
    <div class="card-actions">
      <button class="ghost-btn" onclick="toggleNewVehicle(false)">Vazgeç</button>
      <button class="primary-btn" onclick="createVehicle()">Ekle</button>
    </div>
  </div>

  <div id="noVehicle" class="empty" style="display:none;">Henüz araç eklemedin.<br><b>+ Araç ekle</b> ile başla.</div>
  <div id="vehicleContent" style="display:none;"></div>
</div>

<!-- ALT NAV -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- HIZLI BAKIM EKLE -->
<button class="quick-add-fab" id="quickAddFab" onclick="quickAddBakim()" title="Hızlı Bakım Ekle" style="display:none;">+</button>

<!-- AYARLAR -->
<div id="settingsModal" class="modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 style="font-family:'Newsreader',serif;margin-bottom:16px;">Ayarlar</h2>
    <div class="card" style="margin-bottom:12px;">
      <div class="stat-label">SEÇİLİ ARAÇ</div>
      <div id="settingsVehicleName" style="font-size:16px;font-weight:600;margin:8px 0 12px;"></div>
      <label class="lbl">Araç fotoğrafı</label>
      <input type="file" id="coverPhotoInput" accept="image/*" onchange="saveCoverPhoto(event)" style="margin-bottom:8px;">
      <button class="danger-btn" onclick="deleteVehicleConfirm()">🗑️ Bu Aracı Sil</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="primary-btn" style="width:100%;padding:12px;" id="themeBtn" onclick="toggleTheme()">☀️ Aydınlık Temaya Geç</button>
      <button class="primary-btn" style="width:100%;padding:12px;" onclick="openShare()">📤 Uygulamayı Paylaş</button>
      <button class="primary-btn" style="width:100%;padding:12px;" onclick="testSpeech()">🔊 Sesi Test Et</button>
      <button class="primary-btn" style="width:100%;padding:12px;" onclick="exportData()">📥 Verileri İndir (JSON)</button>
      <button class="primary-btn" style="width:100%;padding:12px;" onclick="exportCSV()">📊 CSV İndir (Excel)</button>
      <button class="primary-btn" style="width:100%;padding:12px;" onclick="document.getElementById('importFile').click()">📂 Geri Yükle</button>
      <input id="importFile" type="file" accept=".json" style="display:none;" onchange="importData(event)">
    </div>
  </div>
</div>

<script>
const SK="aracarim-v6";
const ACCENT_COLORS=["#E8873A","#5B8FD4","#7FA97F","#C1785A","#A97BC1","#D4A85B","#5BC1BA"];
const ACCENT_NAMES=["Turuncu","Mavi","Yeşil","Pas","Mor","Altın","Teal"];
let vehicles=[],activeId=null,activeTab="ozet",mFilter=null,newVehicleColor=ACCENT_COLORS[0];

const uid=()=>Math.random().toString(36).slice(2,10);
const fmtTL=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(n||0);
const fmtDate=iso=>{if(!iso)return"";return new Date(iso+"T00:00:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML;};
const getV=()=>vehicles.find(v=>v.id===activeId);
const setAccent=c=>{document.documentElement.style.setProperty("--accent",c);};

function load(){
  try{const r=localStorage.getItem(SK);const d=r?JSON.parse(r):{};vehicles=d.vehicles||[];activeId=d.activeId||(vehicles[0]?vehicles[0].id:null);}
  catch(e){vehicles=[];activeId=null;}
}
function save(){try{localStorage.setItem(SK,JSON.stringify({vehicles,activeId}));}catch(e){}}

// SPLASH
setTimeout(()=>{
  const s=document.getElementById("splash");
  s.classList.add("hide");
  setTimeout(()=>s.style.display="none",500);
},1800);

// RENK SEÇİCİ
function initColorPicker(){
  document.getElementById("colorOpts").innerHTML=ACCENT_COLORS.map((c,i)=>`
    <div class="color-opt ${c===newVehicleColor?'selected':''}" style="background:${c};" onclick="selectNewVehicleColor('${c}',this)" title="${ACCENT_NAMES[i]}"></div>`).join("");
}
function selectNewVehicleColor(c,el){
  newVehicleColor=c;
  document.querySelectorAll(".color-opt").forEach(e=>e.classList.remove("selected"));
  el.classList.add("selected");
}

// ARAÇ
function toggleNewVehicle(show){
  document.getElementById("newVehicleForm").style.display=show?"block":"none";
  if(show){newVehicleColor=ACCENT_COLORS[0];initColorPicker();}
  else document.getElementById("newVehicleName").value="";
}
function createVehicle(){
  const name=document.getElementById("newVehicleName").value.trim();
  const err=document.getElementById("newVehicleErr");

// UYARILAR
function computeAlerts(v){
  const alerts=[];const now=new Date();now.setHours(0,0,0,0);
  const diff=iso=>Math.floor((new Date(iso+"T00:00:00")-now)/86400000);
  v.records.forEach(r=>{
    if(r.nextKm){const rem=r.nextKm-(v.currentKm||0);
      if(rem<=0)alerts.push({type:"red",text:r.type+" zamanı geçti",sub:(v.currentKm||0).toLocaleString("tr-TR")+" km'desin",badge:"GEÇTİ",p:0});
      else if(rem<=1000)alerts.push({type:"orange",text:r.type+" yaklaşıyor",sub:rem.toLocaleString("tr-TR")+" km kaldı",badge:"YAKLAŞIYOR",p:2});
    }
    if(r.nextDate){const d=diff(r.nextDate);
      if(d<0)alerts.push({type:"red",text:r.type+" tarihi geçti",sub:fmtDate(r.nextDate),badge:"GEÇTİ",p:0});
      else if(d===0)alerts.push({type:"red",text:"⚠️ "+r.type+" BUGÜN SON GÜN!",sub:fmtDate(r.nextDate),badge:"BUGÜN",p:0});
      else if(d<=5)alerts.push({type:"red",text:"🔴 "+r.type+" — "+d+" gün kaldı",sub:fmtDate(r.nextDate),badge:d+"GÜN",p:1});
      else if(d<=15)alerts.push({type:"orange",text:"🟠 "+r.type+" — "+d+" gün kaldı",sub:fmtDate(r.nextDate),badge:d+"GÜN",p:2});
      else if(d<=30)alerts.push({type:"yellow",text:"🟡 "+r.type+" — "+d+" gün kaldı",sub:fmtDate(r.nextDate),badge:d+"GÜN",p:3});
    }
  });
  (v.serviceRecords||[]).forEach(s=>{const d=diff(s.date);
    if(d<0)alerts.push({type:"red",text:s.name+" tarihi geçti",sub:fmtDate(s.date),badge:"GEÇTİ",p:0});
    else if(d===0)alerts.push({type:"red",text:"⚠️ "+s.name+" BUGÜN SON GÜN!",sub:fmtDate(s.date),badge:"BUGÜN",p:0});
    else if(d<=5)alerts.push({type:"red",text:"🔴 "+s.name+" — "+d+" gün kaldı",sub:fmtDate(s.date),badge:d+"GÜN",p:1});
    else if(d<=15)alerts.push({type:"orange",text:"🟠 "+s.name+" — "+d+" gün kaldı",sub:fmtDate(s.date),badge:d+"GÜN",p:2});
    else if(d<=30)alerts.push({type:"yellow",text:"🟡 "+s.name+" — "+d+" gün kaldı",sub:fmtDate(s.date),badge:d+"GÜN",p:3});
  });
  alerts.sort((a,b)=>a.p-b.p);return alerts;
}

// TEKRARLAYAN BAKIM
function applyRepeatRules(v){
  if(!v.repeatRules||v.repeatRules.length===0)return;
  v.repeatRules.forEach(rule=>{
    const last=v.records.filter(r=>r.type===rule.type).sort((a,b)=>b.km-a.km)[0];
    if(last){last.nextKm=(last.km||0)+rule.intervalKm;}
  });
}

function saveRecord(){
  const v=getV();if(!v)return;
  const type=document.getElementById("rType").value.trim();
  const date=document.getElementById("rDate").value;
  const km=parseFloat(document.getElementById("rKm").value);
  const cost=parseFloat(document.getElementById("rCost").value)||0;
  const nextKm=document.getElementById("rNextKm").value?parseFloat(document.getElementById("rNextKm").value):null;
  const nextDate=document.getElementById("rNextDate").value||null;
  const repeatKm=document.getElementById("rRepeat").value?parseFloat(document.getElementById("rRepeat").value):null;
  const note=document.getElementById("rNote").value.trim();
  const photoFile=document.getElementById("rPhoto").files[0];
  const err=document.getElementById("newRecordErr");
  if(!type){err.textContent="Bakım türü gir.";err.style.display="block";return;}
  if(!date){err.textContent="Tarih seç.";err.style.display="block";return;}
  if(isNaN(km)||km<0){err.textContent="Km gir.";err.style.display="block";return;}
  err.style.display="none";
  // Tekrarlayan kural kaydet
  if(!v.repeatRules)v.repeatRules=[];
  if(repeatKm){
    const existing=v.repeatRules.findIndex(r=>r.type===type);
    if(existing>=0)v.repeatRules[existing].intervalKm=repeatKm;
    else v.repeatRules.push({type,intervalKm:repeatKm});
  }
  // Aynı türden önceki kayıtların hedeflerini temizle
  v.records.forEach(r=>{if(r.type===type){r.nextKm=null;r.nextDate=null;}});
  const rec={id:uid(),type,date,km,cost,note,photo:null,
    nextKm:nextKm||(repeatKm?km+repeatKm:null),nextDate};
  if(photoFile){
    const reader=new FileReader();
    reader.onload=e=>{rec.photo=e.target.result;finishRecord(v,rec,km);};
    reader.readAsDataURL(photoFile);
  }else{finishRecord(v,rec,km);}
}
function finishRecord(v,rec,km){
  v.records.unshift(rec);v.records.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(km>(v.currentKm||0))v.currentKm=km;
  save();hideForm("newRecordForm");renderContent();
}
function delRecord(id){const v=getV();if(!v)return;v.records=v.records.filter(r=>r.id!==id);save();renderContent();}

function tabRapor(v){

}

// TAKVİM
function tabTakvim(v){
  const now=new Date();const year=now.getFullYear();const month=now.getMonth();
  const firstDay=(new Date(year,month,1).getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayNum=now.getDate();
  const eventDays={};
  const mStr=`${year}-${String(month+1).padStart(2,"0")}`;
  v.records.forEach(r=>{if(r.date.slice(0,7)===mStr){const d=parseInt(r.date.slice(8));eventDays[d]=(eventDays[d]||[]).concat([{name:r.type}]);}
    if(r.nextDate&&r.nextDate.slice(0,7)===mStr){const d=parseInt(r.nextDate.slice(8));eventDays[d]=(eventDays[d]||[]).concat([{name:"Sonraki: "+r.type,alert:true}]);}});
  (v.serviceRecords||[]).forEach(s=>{if(s.date.slice(0,7)===mStr){const d=parseInt(s.date.slice(8));eventDays[d]=(eventDays[d]||[]).concat([{name:s.name,alert:true}]);}});
  (v.fuelRecords||[]).forEach(r=>{if(r.date.slice(0,7)===mStr){const d=parseInt(r.date.slice(8));eventDays[d]=(eventDays[d]||[]).concat([{name:"Yakıt"}]);}});
  const dayNames=["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
  let calHtml=`<div style="font-size:15px;font-weight:600;margin-bottom:10px;text-align:center;">${now.toLocaleDateString("tr-TR",{month:"long",year:"numeric"})}</div>`;
  calHtml+=`<div class="cal-grid">${dayNames.map(d=>`<div class="cal-day-name">${d}</div>`).join("")}`;
  for(let i=0;i<firstDay;i++)calHtml+=`<div class="cal-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const hasAlert=eventDays[d]&&eventDays[d].some(e=>e.alert);
    const hasEvent=eventDays[d]&&eventDays[d].length>0;
    const isToday=d===todayNum;
    let cls="cal-day"+(isToday?" today":hasAlert?" has-alert":hasEvent?" has-event":"");
    calHtml+=`<div class="${cls}">${d}</div>`;
  }
  calHtml+=`</div>`;
  const allEv=[];
  Object.entries(eventDays).forEach(([day,evs])=>evs.forEach(e=>allEv.push({day:parseInt(day),name:e.name})));
  allEv.sort((a,b)=>a.day-b.day);
  return`<div class="card">${calHtml}</div>
    ${allEv.length===0?`<div class="empty">Bu ay olay yok.</div>`:allEv.map(e=>`<div class="rcard" style="display:flex;align-items:center;gap:10px;padding:10px 14px;"><div style="font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:var(--accent);width:28px;">${e.day}</div><div style="font-size:14px;font-weight:600;">${esc(e.name)}</div></div>`).join("")}`;
}

function tabMaliyet(v){

// YILLIK ÖZET
function tabYillik(v){
  const years={};
  v.records.forEach(r=>{const y=r.date.slice(0,4);if(!years[y])years[y]={maint:0,fuel:0,hasar:0,records:[]};years[y].maint+=(r.cost||0);years[y].records.push(r);});
  (v.fuelRecords||[]).forEach(r=>{const y=r.date.slice(0,4);if(!years[y])years[y]={maint:0,fuel:0,hasar:0,records:[]};years[y].fuel+=(r.cost||0);});
  (v.hasarRecords||[]).forEach(r=>{const y=r.date.slice(0,4);if(!years[y])years[y]={maint:0,fuel:0,hasar:0,records:[]};years[y].hasar+=(r.cost||0);});
  const sy=Object.keys(years).sort().reverse();
  if(sy.length===0)return`<div class="empty">Yıllık veri yok.</div>`;
  const months={};
  v.records.forEach(r=>{const m=r.date.slice(0,7);if(!months[m])months[m]={t:0};months[m].t+=(r.cost||0);});
  (v.fuelRecords||[]).forEach(r=>{const m=r.date.slice(0,7);if(!months[m])months[m]={t:0};months[m].t+=(r.cost||0);});
  const me=Object.entries(months).map(([m,d])=>({m,t:d.t})).sort((a,b)=>a.t-b.t);
  const best=me[0];const worst=me[me.length-1];
  const maxT=Math.max(...sy.map(y=>years[y].maint+years[y].fuel+years[y].hasar),1);
  return`
    ${me.length>1?`<div class="stat-row"><div class="stat-card"><div class="stat-label">En Verimli Ay 🟢</div><div class="stat-value sage" style="font-size:16px;">${best.m}</div><div style="font-size:12px;color:var(--muted);">${fmtTL(best.t)}</div></div><div class="stat-card"><div class="stat-label">En Pahalı Ay 🔴</div><div class="stat-value" style="font-size:16px;">${worst.m}</div><div style="font-size:12px;color:var(--muted);">${fmtTL(worst.t)}</div></div></div>`:""}
    ${sy.map(y=>{const d=years[y];const total=d.maint+d.fuel+d.hasar;const pct=Math.round((total/maxT)*100);const topT=[...new Set(d.records.map(r=>r.type))].slice(0,3).join(", ");
    return`<div class="card" style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div style="font-family:'Newsreader',serif;font-size:22px;font-weight:600;">${y}</div><div style="font-family:'Newsreader',serif;font-size:20px;color:var(--accent);">${fmtTL(total)}</div></div><div style="height:8px;background:var(--ink);border-radius:4px;overflow:hidden;margin-bottom:10px;"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px;"></div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--muted);">🔧 Bakım</span><span>${fmtTL(d.maint)}</span></div><div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--muted);">⛽ Yakıt</span><span>${fmtTL(d.fuel)}</span></div>${d.hasar>0?`<div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--muted);">💥 Hasar</span><span style="color:var(--rust);">${fmtTL(d.hasar)}</span></div>`:""}${topT?`<div style="font-size:12px;color:var(--muted);margin-top:4px;padding-top:8px;border-top:1px solid var(--border);">En sık: ${esc(topT)}</div>`:""}</div></div>`;}).join("")}`;
}


// ÖZET EKRANI
function tabOzet(){
  if(vehicles.length===0) return `<div class="empty">Henüz araç eklemedin.<br><b>+ Araç ekle</b> ile başla.</div>`;
  const now=new Date();now.setHours(0,0,0,0);
  const diff=iso=>Math.floor((new Date(iso+"T00:00:00")-now)/86400000);
  
  const cards=vehicles.map(v=>{
    const alerts=computeAlerts(v);
    const critical=alerts.filter(a=>a.p<=1);
    const warn=alerts.filter(a=>a.p===2||a.p===3);
    const totalCost=v.records.reduce((s,r)=>s+(r.cost||0),0)+(v.fuelRecords||[]).reduce((s,r)=>s+(r.cost||0),0);
    const lastRecord=v.records[0];
    const accentColor=v.color||"var(--accent)";
    let alertHtml="";
    if(critical.length>0) alertHtml=`<div class="ozet-card-alert red">🔴 ${critical.length} acil uyarı</div>`;
    else if(warn.length>0) alertHtml=`<div class="ozet-card-alert orange">🟡 ${warn.length} yaklaşan</div>`;
    else alertHtml=`<div class="ozet-card-alert ok">✅ Sorun yok</div>`;
    return `<div class="ozet-vehicle-card" onclick="selectVehicle('${v.id}');switchTab('bakım')">
      <div class="ozet-card-cover" style="border-bottom:2px solid ${accentColor};">
        ${v.coverPhoto?`<img src="${v.coverPhoto}">`:`<svg width="32" height="32" viewBox="0 0 100 100" fill="none"><path d="M22 62A28 28 0 1 1 78 62" stroke="${accentColor}" stroke-width="8" stroke-linecap="round"/><line x1="50" y1="62" x2="68" y2="40" stroke="${accentColor}" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="62" r="8" fill="${accentColor}"/></svg>`}
      </div>
      <div class="ozet-card-body">
        <div class="ozet-card-name">${esc(v.name)}</div>
        <div class="ozet-card-km">${(v.currentKm||0).toLocaleString("tr-TR")} km · ${fmtTL(totalCost)}</div>
        ${alertHtml}
        ${lastRecord?`<div style="font-size:11px;color:var(--muted);margin-top:4px;">Son: ${esc(lastRecord.type)}</div>`:""}
      </div>
    </div>`;
  }).join("");

  // Toplam tüm araçların uyarıları
  const allAlerts=[];
  vehicles.forEach(v=>{computeAlerts(v).forEach(a=>allAlerts.push({...a,vehicle:v.name}));});
  allAlerts.sort((a,b)=>a.p-b.p);
  const alertsHtml=allAlerts.slice(0,5).map(a=>`
    <div class="alert-box ${a.type}">
      <div><div class="alert-title">${esc(a.vehicle)}: ${esc(a.text)}</div><div class="alert-sub">${esc(a.sub)}</div></div>
      <span class="badge ${a.p<=1?"red":"orange"}">${esc(a.badge)}</span>
    </div>`).join("");

  return `
    <div style="margin-bottom:14px;">
      <div style="font-family:'Newsreader',serif;font-size:18px;font-weight:500;margin-bottom:10px;">Tüm Araçlar</div>
      <div class="ozet-grid">${cards}</div>
    </div>
    ${allAlerts.length>0?`<div style="font-family:'Newsreader',serif;font-size:18px;font-weight:500;margin-bottom:10px;">Aktif Uyarılar</div>${alertsHtml}`:"<div class='empty'>Tüm araçlarda herhangi bir uyarı yok. ✅</div>"}`;
}

// KARŞILAŞTIRMA
function tabKarsilastir(){
  if(vehicles.length<2) return `<div class="empty">Karşılaştırma için en az 2 araç gerekli.</div>`;
  
  const cols=vehicles.length;
  const gridStyle=`grid-template-columns:120px ${"1fr ".repeat(cols).trim()};`;
  
  const metrics=[
    {label:"Toplam Bakım",fn:v=>v.records.reduce((s,r)=>s+(r.cost||0),0),fmt:fmtTL,lowerBetter:true},
    {label:"Toplam Yakıt",fn:v=>(v.fuelRecords||[]).reduce((s,r)=>s+(r.cost||0),0),fmt:fmtTL,lowerBetter:true},
    {label:"Toplam Hasar",fn:v=>(v.hasarRecords||[]).reduce((s,r)=>s+(r.cost||0),0),fmt:fmtTL,lowerBetter:true},
    {label:"Toplam Maliyet",fn:v=>(v.purchasePrice||0)+v.records.reduce((s,r)=>s+(r.cost||0),0)+(v.fuelRecords||[]).reduce((s,r)=>s+(r.cost||0),0)+(v.hasarRecords||[]).reduce((s,r)=>s+(r.cost||0),0),fmt:fmtTL,lowerBetter:true},
    {label:"Km Başına ₺",fn:v=>v.currentKm>0?((v.purchasePrice||0)+v.records.reduce((s,r)=>s+(r.cost||0),0)+(v.fuelRecords||[]).reduce((s,r)=>s+(r.cost||0),0))/v.currentKm:0,fmt:n=>n.toFixed(2)+" ₺/km",lowerBetter:true},
    {label:"Güncel Km",fn:v=>v.currentKm||0,fmt:n=>n.toLocaleString("tr-TR")+" km",lowerBetter:false},
    {label:"Bakım Sayısı",fn:v=>v.records.length,fmt:n=>n+" kayıt",lowerBetter:false},
    {label:"Hasar Sayısı",fn:v=>(v.hasarRecords||[]).length,fmt:n=>n+" hasar",lowerBetter:true},
    {label:"Ort. Tüketim",fn:v=>{
      const fr=v.fuelRecords||[];if(fr.length<2)return null;
      const s=[...fr].sort((a,b)=>a.km-b.km);
      const kd=s[s.length-1].km-s[0].km;const ld=s.reduce((t,r)=>t+r.liters,0)-s[0].liters;
      return kd>0&&ld>0?kd/ld:null;
    },fmt:n=>n===null?"—":n.toFixed(2)+" km/lt",lowerBetter:false},
  ];

  const headerRow=`<div style="display:grid;${gridStyle}gap:8px;margin-bottom:8px;">
    <div></div>
    ${vehicles.map(v=>`<div style="text-align:center;font-size:13px;font-weight:700;color:${v.color||"var(--accent)"};">${esc(v.name)}</div>`).join("")}
  </div>`;

  const rows=metrics.map(m=>{
    const vals=vehicles.map(v=>m.fn(v));
    const validVals=vals.filter(v=>v!==null&&v!==0);
    const bestVal=validVals.length>0?(m.lowerBetter?Math.min(...validVals):Math.max(...validVals)):null;
    return `<div style="display:grid;${gridStyle}gap:8px;margin-bottom:8px;align-items:center;">
      <div style="font-size:12px;color:var(--muted);font-weight:600;">${m.label}</div>
      ${vals.map((val,i)=>{
        const isWinner=bestVal!==null&&val!==null&&val===bestVal;
        const displayVal=val===null?"—":m.fmt(val);
        return`<div class="compare-cell ${isWinner?'winner':''}" style="border-color:${isWinner?"var(--sage)":vehicles[i].color||"var(--border)"};">
          <div class="compare-val" style="font-size:14px;color:${isWinner?"var(--sage)":"var(--paper)"};">${displayVal}</div>
          ${isWinner?`<div style="font-size:10px;color:var(--sage);margin-top:2px;">🏆</div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  return `
    <div style="font-family:'Newsreader',serif;font-size:18px;font-weight:500;margin-bottom:14px;">Araçlar Arası Karşılaştırma</div>
    <div style="overflow-x:auto;">
      ${headerRow}${rows}
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center;">🏆 Daha iyi değer</div>`;
}

    {type:"Ön Fren Balatası",intervalKm:25000},
    {type:"Arka Fren Balatası",intervalKm:18000},
  ],
  "Scooter / Otomatik":[
    {type:"Yağ değişimi",intervalKm:3000},
    {type:"Varyatör Temizliği",intervalKm:8000},

function tabSablonlar(v){
  return `
    <div style="font-family:'Newsreader',serif;font-size:18px;font-weight:500;margin-bottom:6px;">Bakım Takvimi Şablonları</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">Seç, ${esc(v.name)} aracına otomatik tekrarlayan kural eklensin.</p>
    ${Object.entries(TEMPLATES).map(([name,rules])=>`
      <div class="template-card" onclick="applyTemplate('${name}')">
        <div>
          <div class="template-name">${esc(name)}</div>
          <div class="template-sub">${rules.map(r=>r.type+" ("+r.intervalKm.toLocaleString("tr-TR")+" km)").join(", ")}</div>
        </div>
        <span class="template-count">${rules.length} kural</span>
      </div>`).join("")}`;
}

function applyTemplate(templateName){
  const v=getV();if(!v)return;
  const rules=TEMPLATES[templateName];if(!rules)return;
  if(!confirm("'"+templateName+"' şablonunu '"+v.name+"' aracına uygulamak istiyor musun? Mevcut tekrarlayan kurallar güncellenir."))return;
  if(!v.repeatRules)v.repeatRules=[];
  rules.forEach(rule=>{
    const idx=v.repeatRules.findIndex(r=>r.type===rule.type);
    if(idx>=0)v.repeatRules[idx].intervalKm=rule.intervalKm;
    else v.repeatRules.push({type:rule.type,intervalKm:rule.intervalKm});
  });
  save();
  alert("✅ Şablon uygulandı! "+rules.length+" kural eklendi.\nBakım eklerken bu türlerde otomatik sonraki km hesaplanacak.");
  switchTab("bakım");
}

    <div class="vehicle-cover-overlay"><div class="vehicle-cover-info"><div class="vehicle-cover-name">${esc(v.name)}</div><div class="vehicle-cover-sub">${v.plate?v.plate+" · ":""}${v.currentKm?v.currentKm.toLocaleString("tr-TR")+" km":""}</div></div></div>
  </div>`;

  else if(activeTab==="yakıt")content=tabYakit(v);
  else if(activeTab==="muayene")content=tabMuayene(v);
  else if(activeTab==="hasar")content=tabHasar(v);
  else if(activeTab==="rapor")content=tabRapor(v);
  else if(activeTab==="takvim")content=tabTakvim(v);
  else if(activeTab==="servis")content=tabServis(v);
  else if(activeTab==="profil")content=tabProfil(v);
  else if(activeTab==="maliyet")content=tabMaliyet(v);
  else if(activeTab==="yillik")content=tabYillik(v);
  else if(activeTab==="karsilastir")content=tabKarsilastir();
  else if(activeTab==="sablonlar")content=tabSablonlar(v);
  document.getElementById("vehicleContent").innerHTML=coverHtml+content;
}

    <div class="vtab ${x.id===activeId?'active':''}" onclick="selectVehicle('${x.id}')" style="${x.id===activeId&&x.color?'border-color:'+x.color+';color:'+x.color+';':''}">

// PAYLAŞ
function openShare(){
  const v=getV();
  const title="Araçlarım";
  const text=v?v.name+" bakım geçmişim":"Araç bakım takip uygulamam";
  const url=window.location.href.startsWith("file://")
    ?"https://ekremciftci8.github.io/ara-lar-m/"
    :window.location.href;
  // Önce modalı kapat, sonra paylaş
  closeSettings();
  setTimeout(()=>{
    if(navigator.share){
      navigator.share({title,text,url}).catch(()=>{});
      return;
    }
    // Clipboard fallback
    const input=document.createElement("input");
    input.style.cssText="position:fixed;top:0;left:0;opacity:0;";
    input.value=url;
    document.body.appendChild(input);
    input.focus();input.select();
    try{
      document.execCommand("copy");
      alert("Link kopyalandı!\n"+url);
    } catch(e){
      alert("Link:\n"+url);
    }
    document.body.removeChild(input);
  }, 300);
}

// YEDEKLEME
function exportData(){
  const json=JSON.stringify({vehicles,version:6},null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="aracarim-yedek-"+today()+".json";a.click();URL.revokeObjectURL(url);
}
function exportCSV(){
  const v=getV();if(!v)return;
  const rows=[["Tür","Tarih","Km","Tutar","Sonraki Km","Sonraki Tarih","Not"]];
  v.records.forEach(r=>rows.push([r.type,r.date,r.km,r.cost,r.nextKm||"",r.nextDate||"",r.note||""]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=v.name+"-bakim-"+today()+".csv";a.click();URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);vehicles=data.vehicles||[];activeId=vehicles[0]?vehicles[0].id:null;save();closeSettings();render();alert("Veriler yüklendi!");}catch(err){alert("Dosya hatalı!");}};
  reader.readAsText(file);
}

// SES
function speakNotification(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='tr-TR';u.rate=0.9;u.pitch=1;u.volume=1;
  speechSynthesis.speak(u);
}
function testSpeech(){speakNotification("Araçlarım uygulamasına hoş geldiniz. Sesli bildirimler aktif.");}

function checkNotifications(){
  const t=today();
  if(localStorage.getItem("lastNotif")===t)return;
  let msgs=[];
  vehicles.forEach(v=>{
    const alerts=computeAlerts(v);
    alerts.filter(a=>a.p===0).forEach(a=>msgs.push(v.name+": "+a.text.replace(/[⚠️🔴🟠🟡]/g,"").trim()));
  });
  if(msgs.length>0){
    const msg="Dikkat! "+msgs.join(". ");
    setTimeout(()=>{speakNotification(msg);alert("⚠️\n"+msgs.join("\n"));},1000);
  }
  localStorage.setItem("lastNotif",t);
}

function toggleTheme(){
  const isLight=document.documentElement.classList.toggle("light");
  const btn=document.getElementById("themeBtn");
  if(btn)btn.textContent=isLight?"🌙 Karanlık Temaya Geç":"☀️ Aydınlık Temaya Geç";

function loadTheme(){
  const saved=localStorage.getItem("aracarim-theme");

    document.documentElement.classList.add("light");
    const btn=document.getElementById("themeBtn");
    if(btn)btn.textContent="🌙 Karanlık Temaya Geç";
  }
}
